 Dijon.","Fold in finely chopped bell pepper and cucumber.","Spread in whole-grain wraps with baby spinach; roll tightly."]],"Turkey meatball cucumber grain bowl":[["4–6 cooked turkey meatballs from Sunday batch","2 cups cooked grain blend","½ English cucumber, diced","2 Roma tomatoes, diced","4 tbsp tomato sauce"],["Reheat cooked turkey meatballs and tomato sauce to 74°C.","Reheat grain blend separately; divide into two bowls.","Add meatballs with sauce and fresh cucumber and tomato."]],"Meatball and spinach wrap":[["4 cooked turkey meatballs","2 whole-grain wraps","4 tbsp tomato sauce","1 cup baby spinach","2 tbsp plain Greek yogurt"],["Reheat meatballs and tomato sauce thoroughly to 74°C.","Spread yogurt on the wraps, add spinach and halved meatballs with a little tomato sauce.","Roll and serve promptly; keep fillings separate if packing for later."]],"Leftover Thai tofu curry bowl":[["2 portions refrigerated Thai green curry tofu from Tuesday","2 cups cooked grain blend","½ lime","Fresh basil, 4–6 leaves"],["Reheat curry and grain blend separately to 74°C.","Spoon hot grain blend into two bowls and top with curry.","Finish with lime and torn basil."]],"Salmon cucumber rice bowl":[["200–250 g previously cooked salmon, kept refrigerated","2 cups cooked grain blend","½ English cucumber, diced","1 tbsp lemon juice","2 tbsp Greek yogurt","Pinch dill or black pepper"],["Check that salmon was promptly refrigerated after cooking the previous day.","Mix Greek yogurt, lemon and dill into a dressing; cool cooked grain blend before using in a cold bowl.","Flake chilled salmon over grains with cucumber. Keep chilled until eating."]],"Chickpea tomato cucumber salad":[["1 can chickpeas, drained","2 Roma tomatoes, diced","½ English cucumber, diced","2 tbsp lemon juice","2 tsp olive oil","½ tsp oregano","2 cups cooked grain blend (optional)"],["Mix chickpeas, tomato and cucumber.","Whisk lemon juice, oil and oregano then toss.","Serve as salad or with grain blend if a more substantial lunch is desired."]],"Black bean cucumber grain bowl":[["1 can black beans, rinsed","½ English cucumber, diced","1 Roma tomato, diced","2 cups grain blend","Juice of ½ lime","1 tsp olive oil","½ tsp cumin"],["Combine drained beans with cucumber, tomato, lime, cumin and olive oil.","Divide warmed grain blend into two bowls.","Add seasoned beans and vegetables; serve with lime wedges."]],"Sesame chicken vegetable wrap":[["200–250 g cooked ginger chicken from Monday","2 whole-grain wraps","½ red bell pepper, thinly sliced","½ English cucumber, sliced","1 cup spinach","2 tsp tahini or 1 tsp sesame oil with 1 tbsp Greek yogurt"],["Combine tahini with yogurt or make a light sesame-yogurt spread.","Spread onto wraps and layer cooked chicken, peppers, cucumber and spinach.","Roll tightly and keep chilled until eating."]],"Leftover chickpea curry rice bowl":[["2 portions cooked chickpea chole curry, thawed safely if frozen","2 cups cooked grain blend","½ lemon","2 tbsp Greek yogurt"],["Reheat curry and grain blend fully to 74°C.","Divide into two bowls; top with yogurt and lemon.","Add extra hot cauliflower if convenient."]],"Black bean corn tomato salad":[["1 can black beans, rinsed","1 cup cooked frozen corn (cooled)","2 Roma tomatoes, chopped","1 tbsp lime juice","1 tsp olive oil","1 tbsp chopped cilantro","Pinch cumin"],["Cook corn as directed, then cool promptly.","Mix beans, corn and tomatoes with lime juice, oil, cilantro and cumin.","Serve chilled with warmed grains or in lettuce cups."]],"Beef cucumber grain bowl":[["200–250 g cooked beef from Thursday, refrigerated promptly","2 cups cooked grain blend","½ English cucumber, diced","1 tsp sesame oil","1 tbsp reduced-sodium soy sauce","1 scallion, chopped"],["Reheat beef and grain blend to 74°C if serving hot.","Divide grains into two bowls, add beef and diced cucumber.","Season lightly with sesame oil and soy sauce; garnish with scallions."]],"Chickpea cucumber rice salad":[["1 can chickpeas, rinsed","½ English cucumber, diced","2 cups cooked grain blend","2 Roma tomatoes, diced","1 tbsp lemon juice","1 tsp olive oil","½ tsp oregano"],["Mix chickpeas, cucumber, tomatoes and chilled cooked grain blend.","Whisk lemon, oil and oregano and toss into salad.","Keep refrigerated until lunch."]],"Greek chicken tomato wrap":[["200–250 g cooked Greek souvlaki chicken from Monday","2 whole-grain wraps","2 Roma tomatoes, chopped","½ English cucumber, diced","4 tbsp homemade tzatziki","1 cup spinach"],["Spread tzatziki on both wraps.","Top with sliced chilled chicken, tomatoes, cucumber and spinach.","Roll and wrap for lunch; keep refrigerated until eating."]],"Lemongrass tofu edamame rice bowl":[["200–250 g cooked lemongrass tofu from Tuesday","1 cup cooked shelled edamame","2 cups cooked grain blend","½ English cucumber, sliced","Handful fresh mint","½ lime"],["Reheat tofu and grain blend thoroughly if serving warm. Cook edamame according to its package.","Divide grains, tofu, edamame and cucumber between two bowls.","Top with fresh mint and lime juice; add carrot-daikon pickle if available."]],"Adobo chicken vegetable rice bowl":[["200–250 g cooked adobo chicken from Wednesday","2 cups cooked grain blend","2 cups air-fried broccoli or cauliflower","2 tbsp reserved fully cooked adobo sauce"],["Reheat previously cooked adobo chicken and sauce to 74°C.","Air-fry frozen broccoli/cauliflower until hot and tender; heat grains.","Serve chicken, grains and vegetables with a small spoon of reduced adobo sauce."]],"Salmon cucumber grain salad":[["200–250 g cooked salmon from Thursday, chilled promptly","2 cups cooked grain blend","½ English cucumber, diced","1 cup baby spinach","1 tbsp lemon juice","2 tbsp plain Greek yogurt","Black pepper"],["Flake salmon gently and check it was stored safely overnight.","Toss chilled grains with diced cucumber and spinach.","Stir lemon and yogurt, fold gently into salad and add salmon. Keep chilled."]]};
const detailedDinners={"lemon-chicken":{"time":"30 min active + optional marinating","makes":"3–4 portions (dinner for two and lunch)","ingredients":["650 g boneless skinless chicken thighs","2 tbsp plain Greek yogurt","1 tbsp olive oil","2 tbsp fresh lemon juice","3 garlic cloves, minced","1 tsp dried oregano, ½ tsp paprika, black pepper","350 g frozen broccoli","Cooked rice–quinoa–lentil blend, to serve"],"steps":["Stir yogurt, oil, lemon juice, garlic, oregano, paprika and pepper in a bowl. Coat chicken; refrigerate up to a day, or freeze promptly in a sealed bag.","Heat an oiled skillet on medium-high. Cook thawed chicken about 5–7 minutes per side (adjust for thickness), until a thermometer reads 74°C.","At the same time, toss frozen broccoli with a teaspoon of oil and air-fry at 200°C for roughly 12–16 minutes, shaking halfway.","Warm your grain blend thoroughly. Spoon pan juices over chicken and serve with lemon wedges. Refrigerate the lunch portion promptly."],"prep":"Sunday: put the chicken and marinade together. Use a clean, separately mixed yogurt sauce if you want one for serving."},"ginger-tofu":{"time":"25 min","makes":"2 portions","ingredients":["400–450 g firm tofu, drained and cubed","350 g frozen cauliflower","1 red bell pepper, thinly sliced","2 tbsp reduced-sodium soy sauce","1 tsp sesame oil","2 tsp rice vinegar","2 tsp freshly grated ginger","2 garlic cloves, minced","1 tsp honey or maple syrup","1 tsp neutral oil, grain blend to serve"],"steps":["Whisk soy sauce, sesame oil, vinegar, ginger, garlic and honey together.","Dry the tofu thoroughly. Sear in a nonstick skillet with the neutral oil for 7–9 minutes, turning occasionally, until golden.","Add bell pepper and cook 3 minutes. Pour in soy mixture; toss for 1–2 minutes until glossy.","Air-fry cauliflower directly from frozen at 200°C for about 15–20 minutes, shaking once. Serve tofu and vegetables over hot grain blend."],"prep":"For best browning, don't put wet marinade on the tofu before searing. Mix sauce ahead and keep chilled."},"miso-salmon":{"time":"25 min plus 20–60 min marinating","makes":"2 portions (increase salmon for lunch)","ingredients":["400–450 g skinless salmon fillets (or 650–700 g if saving lunch)","1½ tbsp white miso","1 tbsp mirin","1 tbsp sake or water","1 tsp reduced-sodium soy sauce","1 tsp honey or sugar","350 g frozen broccoli OR 200 g frozen shelled edamame","Grain blend, to serve"],"steps":["Mix miso, mirin, sake, soy and honey until smooth. Spread on salmon and refrigerate for 20–60 minutes; avoid marinating fish for several days.","Heat the oven to 200°C. Set salmon on a lined tray; scrape off large excess blobs of miso to reduce scorching.","Roast 12–16 minutes depending on thickness, or use the Ninja on an appropriate fish setting. Check for 70°C at the thickest part per Canadian guidance.","Air-fry frozen broccoli separately (or boil edamame according to package). Serve with heated grain blend."],"prep":"Freeze fish plain if not using promptly; thaw in the fridge and add miso glaze shortly before cooking."},"korean-chicken":{"time":"25–30 min","makes":"2 portions","ingredients":["450–500 g boneless skinless chicken thighs","2 tbsp reduced-sodium soy sauce","1 tbsp oyster sauce","1 tsp sesame oil","2 tsp grated ginger","2 garlic cloves, minced","1 tsp honey","1 tsp rice vinegar","350 g frozen broccoli","½ cucumber sliced, grain blend, optional toasted sesame seeds"],"steps":["Combine soy, oyster sauce, sesame oil, ginger, garlic, honey and vinegar. Coat chicken in a freezer bag and freeze promptly, or refrigerate if cooking within a day.","Thaw chicken overnight in the fridge. Cook in a lightly oiled skillet 5–7 minutes per side until 74°C inside; turn down heat if sugars darken too quickly.","Air-fry broccoli at 200°C for 12–16 minutes. Reheat grain blend.","Slice cooked chicken and finish with cucumber and a sprinkle of sesame. Discard unused raw marinade unless thoroughly boiled."],"prep":"Asian ginger-soy inspired, not represented as an authentic Korean dish."},"adobo":{"time":"60–70 min, mostly unattended","makes":"2 dinner portions + possible lunch","ingredients":["600–650 g boneless skinless chicken thighs (or bone-in drumsticks for classic texture)","¼ cup reduced-sodium soy sauce","¼ cup apple cider vinegar","5 garlic cloves, lightly crushed","2 bay leaves","½ tsp whole black peppercorns","½ cup water","350 g frozen broccoli or cauliflower","Cooked grain blend, to serve"],"steps":["Combine chicken, soy, vinegar, garlic and peppercorns. Refrigerate at least 1 hour or freeze promptly in a leakproof freezer bag.","Transfer thawed chicken and all marinade into a covered saucepan; add bay leaves and water. Bring to a simmer, then cook gently about 35–45 minutes until tender and chicken reaches 74°C.","Remove lid; simmer 10–15 minutes to reduce the sauce. Taste before adding any salt: the soy sauce may be sufficient.","While the sauce reduces, air-fry frozen broccoli or cauliflower at 200°C, 12–20 minutes. Serve chicken, sauce and vegetables over warm grain blend."],"prep":"Best for Sunday batch-cooking or an unhurried evening; reheated adobo is excellent. Reserve any lunch portion promptly."},"turkey-meatballs":{"time":"40–50 min Sunday; 10 min to serve","makes":"About 12–14 meatballs / 4 portions","ingredients":["900 g–1 kg lean ground turkey","1 large egg","⅓ cup breadcrumbs","3 garlic cloves, minced","2 tbsp finely chopped parsley or basil","1 tsp dried oregano","½ tsp black pepper, ½ tsp salt","500 mL passata","1 small onion, minced","1 tsp olive oil","350 g frozen cauliflower, grain blend to serve"],"steps":["Mix turkey, egg, breadcrumbs, half the garlic, herbs, oregano, salt and pepper just until combined. Shape into 12–14 balls.","Bake on a lined tray at 210°C for 18–22 minutes or until every meatball reaches 74°C.","For sauce, soften onion and remaining garlic in a little olive oil; add passata and simmer 10 minutes. Gently add fully cooked meatballs.","Refrigerate portions for Monday/Tuesday; freeze Thursday's meal immediately after prompt cooling. Air-fry cauliflower just before serving."],"prep":"Make this whole batch on Sunday; it supplies Monday dinner, Tuesday lunch and Thursday dinner."},"thai-tofu":{"time":"40–50 min","makes":"3–4 portions (dinner plus lunch)","ingredients":["400–450 g extra-firm tofu, cubed","1 tsp neutral or avocado oil","1 small onion, chopped","1 tbsp grated ginger","2–3 tbsp Thai green curry paste (check spice and fish/shrimp ingredients)","1 tsp lemongrass paste","1 carrot, sliced","300 g frozen cauliflower","1 small zucchini, sliced","1 can (400 mL) light coconut milk","1 lime, zest and juice","Fresh basil or cilantro to finish","Grain blend to serve"],"steps":["Dry tofu and sear in a skillet with oil until golden, about 7–8 minutes. Remove to a plate.","In the same pan cook onion 3 minutes, then ginger, lemongrass and green curry paste for 1 minute until aromatic.","Add carrot and cauliflower with ¼ cup water; cover for 5 minutes. Add zucchini and coconut milk, simmer 8–10 minutes until vegetables are tender.","Return tofu to the pan. Stir in lime zest and a little juice; scatter with basil or cilantro. Serve over grains and refrigerate extra curry promptly."],"prep":"Best if made Tuesday night, or cooked and frozen on Sunday if you prefer an easier weekday."},"turkey-skillet":{"time":"15–20 min","makes":"2 portions","ingredients":["350–450 g fully cooked frozen turkey meatballs from the Sunday batch","1–1½ cups cooked tomato sauce from the Sunday batch","350 g frozen broccoli","Grain blend to serve","Fresh basil or parsley if available"],"steps":["Thaw meatballs and sauce in the refrigerator if possible; otherwise heat gently from frozen with a splash of water, covered.","Simmer meatballs in tomato sauce until uniformly hot, reaching 74°C in the centre.","Air-fry frozen broccoli at 200°C for 12–16 minutes. Serve meatballs and sauce over heated grain blend; finish with basil."],"prep":"No extra raw turkey needed; reserve this from Monday's batch."},"teriyaki-tofu":{"time":"25–30 min, plus pressing tofu","makes":"2 portions","ingredients":["400–450 g medium-firm or firm tofu","2–3 tbsp cornstarch or potato starch","1–2 tbsp neutral oil for pan-frying","2 tbsp sake (or water)","2 tbsp mirin","2 tbsp reduced-sodium soy sauce","350 g frozen cauliflower","1 scallion, chopped","Cooked grain blend"],"steps":["Wrap tofu in a clean towel and press 15–20 minutes. Cut into 1 cm slabs and dust lightly with starch, shaking off excess.","Mix sake, mirin and soy in a small cup. Heat oil in a nonstick pan over medium and fry tofu 3–4 minutes per side until crusted.","Pour teriyaki liquid around tofu. Bubble gently for 1–2 minutes, turning pieces until glossy and coated.","Air-fry frozen cauliflower at 200°C for about 15–20 minutes. Serve tofu and cauliflower over the grain blend; scatter chopped scallion."],"prep":"Press tofu during another kitchen task. Avoid freezing tofu if you prefer a smooth rather than sponge-like texture."},"ginger-chicken":{"time":"25–30 min","makes":"3 portions including Tuesday lunch","ingredients":["650 g boneless skinless chicken thighs or breast, sliced","350 g frozen broccoli","1 red bell pepper, sliced","2 tbsp reduced-sodium soy sauce","1 tbsp oyster sauce","1 tbsp water","2 tsp cornstarch","2 tsp finely grated ginger","2 garlic cloves, minced","2 tsp neutral oil","Cooked grain blend"],"steps":["Whisk soy, oyster sauce, water and cornstarch. Set a clean sauce aside before touching the raw chicken.","Sear chicken in a hot skillet with neutral oil in two batches to brown it, then return to pan with ginger and garlic. Cook to 74°C.","Add sliced pepper for 3 minutes, then pour in sauce and bubble until glossy. Air-fry broccoli from frozen separately at 200°C for 12–16 minutes.","Serve with grain blend. Cool and refrigerate Tuesday's lunch portion promptly."],"prep":"Prep peppers and sauce on Sunday. Freeze any raw chicken intended for later in the week."},"chickpea-curry":{"time":"35–40 min; 10 min if frozen and reheated","makes":"4 portions","ingredients":["2 cans (540 mL each) chickpeas, drained and rinsed","1 medium onion, finely chopped","3 garlic cloves, minced","1 tbsp grated ginger","1 can (398 mL) crushed tomatoes","1½ tsp ground cumin","1½ tsp ground coriander","½ tsp turmeric","½ tsp garam masala","1 tsp neutral oil","350 g frozen cauliflower","½ cup water","1 lime or lemon, grain blend to serve"],"steps":["Warm oil in a saucepan; soften onion for 5 minutes. Add garlic, ginger, cumin, coriander, turmeric and garam masala for about 45 seconds.","Add crushed tomatoes, chickpeas and water. Simmer uncovered 15–20 minutes until the tomato sauce thickens; season to taste.","While the curry simmers, air-fry frozen cauliflower at 200°C for 15–20 minutes (or simmer it in the curry for a softer texture).","Finish curry with lemon or lime. Serve with grain blend. Cool and freeze Wednesday's lunch portion promptly if preparing Sunday."],"prep":"Tomato-based chole-inspired chickpea curry, adapted for freezer convenience."},"chicken-fajita":{"time":"25 min","makes":"2 portions","ingredients":["450–500 g boneless skinless chicken thighs or breast, sliced","1 red bell pepper and 1 yellow bell pepper, sliced","½ onion, thinly sliced","1 tsp neutral oil","1 tsp ground cumin","1 tsp smoked paprika","½ tsp oregano","½ tsp garlic powder","½ lime","1 cup drained black beans","Grain blend, salsa and cilantro to serve"],"steps":["Mix cumin, smoked paprika, oregano and garlic powder into the sliced chicken. Refrigerate if cooking promptly or freeze the seasoned chicken.","Heat oil in a large skillet. Sear thawed chicken in a single layer, turning until cooked to 74°C; transfer to a plate.","In the same pan cook onion and bell peppers until tender and lightly charred, 5–7 minutes. Return chicken to warm through.","Heat black beans and grains. Build bowls with chicken, peppers, beans and a spoonful of salsa; finish with lime."],"prep":"Keep peppers outside the raw chicken freezer bag to preserve their texture."},"beef-broccoli":{"time":"25–30 min","makes":"3 portions including Friday lunch","ingredients":["600–700 g thinly sliced beef sirloin or flank","450 g frozen broccoli","2 garlic cloves, minced","2 tsp ginger, minced","2 tbsp reduced-sodium soy sauce","1 tbsp oyster sauce","1 tbsp water","2 tsp cornstarch","2 tsp neutral oil","Grain blend to serve"],"steps":["Pat beef dry and slice very thinly across the grain. Mix soy, oyster sauce, water and cornstarch in a small cup.","Use a large hot skillet to sear beef in two batches with the oil for 1–2 minutes per side. Cook to the appropriate safe temperature for the cut; transfer to a plate.","Briefly cook ginger and garlic, then add sauce; bubble until thickened. Add beef back to coat and warm through.","Air-fry frozen broccoli at 200°C for 12–16 minutes or steam it if you prefer restaurant texture. Serve over grains; promptly refrigerate Friday lunch."],"prep":"A small amount of cornstarch makes the sauce glossy. Keep skillet uncrowded for searing."},"fried-rice":{"time":"20–25 min","makes":"2 generous portions","ingredients":["3 cups previously cooled and frozen rice–quinoa–lentil blend","400–450 g firm tofu, cubed","200 g frozen shelled edamame, cooked according to package","1 large egg (optional)","1 carrot, finely diced","2 scallions, chopped","1½ tbsp reduced-sodium soy sauce","1 tsp sesame oil","2 tsp neutral oil","Black pepper"],"steps":["Prepare frozen grain blend for cooking: reheat straight from frozen until loosened and hot, or thaw safely in the fridge.","Sear dried tofu cubes in one teaspoon neutral oil until golden; set aside. Scramble egg in the same skillet if using.","Stir-fry diced carrot and scallion whites in the remaining oil for 3 minutes. Add grain blend and edamame and stir until very hot throughout (74°C).","Return tofu and egg. Toss with soy sauce and sesame oil and finish with scallion greens and black pepper."],"prep":"Use grain portions frozen soon after cooking. Avoid holding cooked rice at room temperature."},"greek-chicken":{"time":"30 min plus marinating","makes":"3 portions (dinner plus Tuesday lunch)","ingredients":["650 g boneless skinless chicken thighs","2 tbsp fresh lemon juice","1 tbsp olive oil","3 garlic cloves, minced","2 tsp dried oregano","½ tsp salt, black pepper","350 g frozen broccoli","1 English cucumber","2 Roma tomatoes","Greek tzatziki (see Sides & pickles), grain blend to serve"],"steps":["Stir lemon juice, olive oil, garlic, oregano, salt and pepper. Coat chicken, refrigerate 30 minutes or freeze promptly in a labelled bag.","Sear or grill chicken over medium-high heat about 5–7 minutes per side, checking the thickest part reaches 74°C. Rest 5 minutes before slicing.","Air-fry broccoli at 200°C for 12–16 minutes. Dice some cucumber and Roma tomatoes for a fresh salad.","Serve sliced chicken with grain blend, tomato-cucumber salad and tzatziki. Chill the lunch portion promptly."],"prep":"Make tzatziki separately so yogurt sauce never contacts raw chicken."},"lemongrass-tofu":{"time":"25–30 min","makes":"3 portions (dinner and lunch)","ingredients":["600–700 g firm tofu, pressed and sliced","1½ tbsp finely minced lemongrass or 1 tbsp paste","2 garlic cloves, minced","1 tbsp reduced-sodium soy sauce","1 tsp sugar","2 tsp neutral oil","350 g frozen cauliflower","½ English cucumber, sliced","½ cup fresh mint leaves","1 lime","Grain blend to serve"],"steps":["Combine lemongrass, garlic, soy and sugar. Pat tofu dry and sear in a wide skillet with neutral oil until browned on both sides.","Add the lemongrass mixture to the pan and toss tofu briefly, about 1–2 minutes, until fragrant and coated; avoid burning the sugar.","Air-fry cauliflower at 200°C for 15–20 minutes, shaking halfway.","Serve with hot grain blend, cucumber, mint and lime. Add Vietnamese carrot–daikon quick pickle if made; cool extra tofu promptly for next-day lunch."],"prep":"Vegetarian adaptation of Vietnamese lemongrass bowls; the linked source's chicken version differs."},"lemon-salmon":{"time":"25 min","makes":"3 portions (dinner and Friday lunch)","ingredients":["650–700 g salmon fillet","1 tbsp lemon juice","1 tsp Dijon mustard","2 garlic cloves, minced","1 tsp olive oil","Black pepper","350 g frozen cauliflower","1 cup halved cherry tomatoes (optional)","Grain blend to serve"],"steps":["Heat oven to 200°C. Mix lemon juice, Dijon, garlic, oil and black pepper and spread over salmon.","Lay salmon on a lined tray, scatter tomatoes alongside if using, and roast 12–18 minutes according to thickness; verify 70°C internally.","Air-fry frozen cauliflower at 200°C for 15–20 minutes separately.","Serve salmon with grains and cauliflower. Refrigerate the remaining salmon promptly for Friday's chilled cucumber salad."],"prep":"A lemon-Dijon salmon variation; keep leftover fish cold and use it the following day."},"tinola":{"time":"55–70 min","makes":"2–3 portions","ingredients":["500–600 g chicken thighs or bone-in chicken pieces","1 tbsp fresh ginger, thinly sliced","4 garlic cloves, minced","1 small onion, sliced","1 tsp neutral oil","1 small green papaya, peeled and cut into cubes (about 2 cups)","3 cups low-sodium chicken broth plus water as needed","1 tbsp fish sauce, adjust to taste","2 small heads baby bok choy or 2 cups malunggay/spinach","Grain blend to serve"],"steps":["Heat oil in a soup pot. Cook onion, garlic and sliced ginger for 2–3 minutes until fragrant. Add chicken and stir for 3–4 minutes.","Add broth and a splash of water. Bring to a simmer; cover and cook gently 25–35 minutes until chicken is tender and reaches 74°C.","Add green papaya and simmer about 10 minutes until tender. Stir in fish sauce and taste before adding salt.","Add bok choy or leafy greens for the final 2–3 minutes. Ladle soup into bowls and serve grain blend separately."],"prep":"Best cooked fresh on an unhurried night or on Sunday. For a weekday shortcut, cook and freeze the soup base without greens and add them while reheating."}};
const detailedBreakfasts={"Blueberry-banana overnight oats":{"serves":"2 jars · prepare the night before","i":["1 cup rolled oats","¾ cup milk or unsweetened soy beverage","⅔ cup plain Greek yogurt","2 tsp chia seeds","1 medium ripe banana, sliced","1 cup blueberries (fresh or frozen)","1 tbsp chopped pecans (optional)"],"s":["Divide oats, milk, yogurt and chia evenly between two jars; stir thoroughly.","Top each with ½ cup blueberries, cover and chill overnight (at least 4 hours).","Before eating, add ½ sliced banana to each jar, and pecans if desired. If too thick, loosen with milk."]},"Gala apple pie overnight oats":{"serves":"2 jars · 10 min prep plus chilling","i":["1 cup rolled oats","¾ cup milk","⅔ cup plain Greek yogurt","1 medium Gala apple, finely diced","2 tsp chia seeds","½ tsp cinnamon","2 tsp maple syrup (optional)","2 tbsp chopped walnuts"],"s":["Divide oats, milk, yogurt, chia and cinnamon between two jars; stir well.","Fold in half the diced Gala apple to each; add maple syrup if using.","Cover and refrigerate overnight. Add walnuts before serving to keep them crisp."]},"Mushroom-spinach scrambled eggs":{"serves":"2 breakfasts · 12 min","i":["4 large eggs","200 g cremini mushrooms, thinly sliced","60 g baby spinach","1 tsp olive oil","2 slices whole-grain toast","Salt and black pepper","1 Gala apple, halved, if desired"],"s":["Heat oil in a nonstick skillet; cook mushrooms for 5 minutes until most moisture evaporates.","Add spinach and wilt 1 minute. Beat eggs with pepper and a little salt, pour into pan, stir gently until cooked through.","Serve half to each person with one slice of toast, plus half a Gala apple if desired."]},"Strawberry yogurt with walnuts":{"serves":"2 bowls · 5 min","i":["350 g plain Greek yogurt (0–2% or preferred)","200 g strawberries, hulled and sliced","20 g walnut pieces","2 tbsp rolled oats","Pinch of cinnamon (optional)"],"s":["Spoon 175 g yogurt into each bowl.","Divide 100 g strawberries, 10 g walnuts and 1 tbsp oats between each bowl.","Add cinnamon if desired and eat immediately."]},"Blueberry yogurt with walnuts":{"serves":"2 bowls · 5 min","i":["350 g plain Greek yogurt","150 g blueberries","20 g walnuts","2 tbsp rolled oats"],"s":["Divide Greek yogurt between two bowls.","Top each with 75 g blueberries, 10 g walnuts and a tablespoon of oats.","Serve immediately, or pack toppings separately to preserve crunch."]},"Peanut-butter banana overnight oats":{"serves":"2 jars · 10 min prep + overnight chilling","i":["1 cup rolled oats","1 cup milk or fortified soy beverage","⅔ cup plain Greek yogurt","2 tbsp smooth peanut butter","2 tsp chia seeds","½ tsp ground cinnamon","1 medium ripe banana, sliced just before serving"],"s":["Whisk milk, Greek yogurt, peanut butter, chia and cinnamon together until smooth.","Divide oats between two jars. Pour half the liquid mixture over each and stir until the oats are fully moistened.","Cover and refrigerate overnight (at least four hours).","Just before serving, slice the banana and divide it between both jars. Stir; add a splash of milk if needed."]}};
const detailedSides={"Japanese sunomono cucumber and wakame":{"serves":"2–3 side portions · 15 min","i":["1 English cucumber (or 2 Persian cucumbers), thinly sliced","1 tbsp dried wakame","2 tbsp rice vinegar","1 tsp sugar","½ tsp reduced-sodium soy sauce","½ tsp sesame seeds","Pinch of salt"],"s":["Sprinkle cucumber slices with a pinch of salt, rest 5–10 minutes, then squeeze out excess water.","Soak wakame in water 5 minutes until expanded; drain and squeeze.","Dissolve sugar in vinegar and soy sauce, toss with cucumber and wakame, sprinkle sesame on top. Serve chilled."]},"Korean spicy cucumber (oi-muchim)":{"serves":"2–3 side portions · 10 min","i":["1 English cucumber, sliced into half-moons","1 tbsp soy sauce","1 tbsp rice vinegar","1 tsp gochugaru (Korean chili flakes)","1 tsp sesame oil","1 garlic clove, grated","1 scallion, thinly sliced","1 tsp toasted sesame seeds"],"s":["Slice cucumber and pat dry with kitchen towel.","Whisk soy sauce, vinegar, gochugaru, sesame oil and garlic.","Toss cucumber with dressing and scallions, sprinkle sesame and serve soon after mixing for best crunch."]},"Pickled red onions":{"serves":"1 small jar · 10 min active","i":["1 medium red onion, very thinly sliced","½ cup apple cider vinegar","½ cup hot water","1 tbsp sugar","1 tsp kosher salt","1 bay leaf"],"s":["Pack onion slices and bay leaf into a clean heatproof jar.","Mix vinegar, hot water, sugar and salt until dissolved; pour over onion to submerge.","Cool briefly, cover and refrigerate. Use once pink and tangy, ideally after at least 1 hour. These are refrigerator pickles, never shelf-stable."]},"Japanese spinach ohitashi":{"serves":"2 side portions · 20 min plus chilling","i":["250–300 g fresh spinach","½ cup prepared dashi or kombu broth","1 tbsp reduced-sodium soy sauce","1 tsp mirin","1 tbsp bonito flakes (optional; omit for vegetarian)"],"s":["Bring a pot of water to a boil. Blanch spinach 30–60 seconds, then transfer immediately to cold water.","Squeeze spinach gently but thoroughly and cut into 4 cm lengths.","Mix dashi, soy and mirin. Soak spinach for 10–15 minutes, drain some liquid, and garnish with bonito flakes if desired."]},"Vietnamese carrot and daikon quick pickles":{"serves":"1 small jar · 15 min active","i":["2 medium carrots, cut into thin matchsticks","½ small daikon, cut into thin matchsticks","½ cup rice vinegar","½ cup warm water","1½ tbsp sugar","½ tsp kosher salt"],"s":["Cut carrot and daikon into thin sticks and pack into a clean jar.","Stir vinegar, warm water, sugar and salt until dissolved, then pour over the vegetables.","Cover and refrigerate for at least 1 hour. Drain portions with a clean fork; keep chilled. These are refrigerator pickles only."]},"Greek tzatziki":{"serves":"Approx. 1 cup · 15 min","i":["½ English cucumber, coarsely grated","¾ cup plain Greek yogurt","1 tbsp lemon juice","1 small garlic clove, finely grated","1 tbsp fresh dill, chopped","1 tsp olive oil","Pinch salt and black pepper"],"s":["Grate cucumber, sprinkle lightly with salt and squeeze firmly in a clean towel to remove excess moisture.","Mix cucumber, yogurt, lemon juice, garlic, dill and olive oil. Season with pepper.","Chill 15–30 minutes to let flavour develop. Serve with chicken souvlaki or as a dressing."]}};
const detailedMarinades={"Asian ginger-soy chicken":{"serves":"For 450–500 g raw chicken","i":["2 tbsp reduced-sodium soy sauce","1 tbsp oyster sauce","1 tsp sesame oil","1 tsp freshly grated ginger","2 garlic cloves, minced","1 tsp honey","1 tsp rice vinegar"],"s":["Mix all ingredients in a small bowl.","Add to a leakproof bag with 450–500 g boneless chicken thighs. Massage to coat.","Freeze immediately if intended for a later day. Thaw in refrigerator; cook to 74°C, discard any uncooked marinade."]},"Greek souvlaki lemon-oregano":{"serves":"For 450–500 g raw chicken","i":["1 tbsp olive oil","2 tbsp fresh lemon juice","2 garlic cloves, minced","1½ tsp dried oregano","½ tsp salt and black pepper"],"s":["Mix marinade ingredients and coat chicken in a freezer-safe bag.","Seal flat and freeze promptly, or refrigerate briefly if cooking the next day.","Thaw in fridge, grill or pan-cook to 74°C, and serve with cucumber and homemade tzatziki."]},"Filipino chicken adobo":{"serves":"For 450–500 g raw chicken","i":["3 tbsp reduced-sodium soy sauce","3 tbsp apple cider vinegar","3 garlic cloves, crushed","1 bay leaf","¼ tsp black peppercorns"],"s":["Combine the soy sauce, vinegar, garlic, bay leaf and peppercorns with chicken thighs in a freezer bag.","Freeze promptly, or refrigerate covered until ready to cook.","Transfer all contents to a saucepan, add ⅓ cup water and simmer until chicken reaches 74°C; reduce sauce until flavourful. Never use the raw liquid as an uncooked dip."]},"All-purpose chicken marinade":{"serves":"For 450–500 g raw chicken","i":["1 tbsp olive oil","1 tbsp reduced-sodium soy sauce","1 tbsp lemon juice","1 tbsp Worcestershire sauce","1 garlic clove, minced","½ tsp dried oregano","½ tsp paprika"],"s":["Whisk all ingredients until combined.","Coat chicken in a freezer-safe bag and freeze promptly or refrigerate until cooking.","Thaw refrigerated; bake, grill or pan-sear to 74°C. Pair with freshly air-fried broccoli."]},"Greek yogurt and oregano chicken":{"serves":"For 450–500 g raw chicken","i":["⅓ cup plain Greek yogurt","2 garlic cloves, minced","1 tsp oregano","1 tbsp lemon juice","½ tsp paprika","Black pepper"],"s":["Mix yogurt, oregano, garlic, lemon, paprika and pepper.","Coat chicken in a sealed bag and freeze immediately if not cooking the next day.","Thaw in the fridge; scrape away excess yogurt and cook in a skillet or oven to 74°C."]},"Vietnamese lemongrass chicken":{"serves":"For 450–500 g raw chicken","i":["1 tbsp finely minced lemongrass","1 tbsp fish sauce","2 minced garlic cloves","1 tsp sugar","1 tsp neutral oil","½ tsp grated ginger"],"s":["Mix lemongrass, fish sauce, garlic, sugar, oil and ginger.","Toss with chicken in a leakproof freezer bag and freeze promptly.","After fridge thawing, grill or pan-sear to 74°C. Finish with lime juice and fresh mint after cooking."]}};
const testedSources={"lemon-chicken":["RecipeTin Eats","https://www.recipetineats.com/lebanese-lemon-garlic-chicken-al-aseel-copycat/","Follow Nagi's tested lemon-garlic marinade; add air-fried broccoli and a measured grain serving."],"ginger-tofu":["Skinnytaste","https://www.skinnytaste.com/tofu-stir-fry-with-vegetables-in-a-soy-sesame-sauce/","Cook the tested tofu and soy-sesame vegetable stir-fry; use cauliflower on the side if preferred."],"miso-salmon":["Just One Cookbook","https://www.justonecookbook.com/miso-salmon/","Follow Nami's original sake, mirin, miso and soy marinade and timing; cook salmon fresh."],"korean-chicken":["RecipeTin Eats","https://www.recipetineats.com/asian-marinated-chicken/","Use this established Asian-style ginger-soy marinade (not presented as traditional Korean)."],"adobo":["Skinnytaste","https://www.skinnytaste.com/filipino-adobo-chicken/","Use the reduced-fat tested Filipino chicken adobo. Original uses skinless bone-in drumsticks; if using thighs, nutrition and timing change."],"turkey-meatballs":["Skinnytaste","https://www.skinnytaste.com/skinny-italian-meatballs-turkey-1-p/","Cook this tested tomato-sauce turkey meatball recipe; freeze the later-week portions."],"thai-tofu":["Skinnytaste","https://www.skinnytaste.com/tofu-green-curry-with-vegetables/","Use measured light coconut milk and Thai green curry paste. Includes cauliflower in the original."],"turkey-skillet":["Skinnytaste","https://www.skinnytaste.com/skinny-italian-meatballs-turkey-1-p/","Reheat the tested meatballs and tomato sauce prepared earlier; add fresh air-fried broccoli."],"teriyaki-tofu":["Just One Cookbook","https://www.justonecookbook.com/teriyaki-tofu/","Follow the tested tofu starch-coating and sake-mirin-soy glaze for proper texture."],"ginger-chicken":["Skinnytaste","https://www.skinnytaste.com/chicken-and-broccoli-stir-fry/","Use the original ginger-garlic chicken-and-broccoli sauce and cooking sequence."],"chickpea-curry":["BBC Good Food","https://www  <div class="callout gold" style="margin-top:17px"><strong>Don't force the clock:</strong> Cooked meatballs and a whole curry can push Sunday over two hours. Choose one such cooked dish, not both, if your priority is a short Sunday routine.</div>

 <div class="grid cols-3"><div class="label-card"><b>PROTEIN:</b> Chicken thigh<br><b>FLAVOUR:</b> Ginger soy<br><b>RAW WEIGHT:</b> 450 g<br><b>FROZEN:</b> __________<br><b>COOK TO:</b> 74°C</div><div class="label-card"><b>COMPONENT:</b> Grain blend<br><b>SERVINGS:</b> 2<br><b>COOKED:</b> __________<br><b>FROZEN:</b> __________<br><b>REHEAT TO:</b> 74°C</div><div class="label-card"><b>MEAL:</b> Chickpea curry<br><b>SERVINGS:</b> 2<br><b>COOKED:</b> __________<br><b>FROZEN:</b> __________<br><b>REHEAT TO:</b> 74°C</div></div>`}
function marinades(){return `${heading('Marinate & freeze','Six complete marinades with ingredients and freezer instructions. No external recipe required.')}
<div class="grid cols-4"><div class="card stat"><div class="ico">①</div><div class="smallcap">Portion</div><p>Divide chicken into dinner-sized packs.</p></div><div class="card stat"><div class="ico">②</div><div class="smallcap">Mix</div><p>Make a marinade below in the exact quantity shown.</p></div><div class="card stat"><div class="ico">③</div><div class="smallcap">Freeze</div><p>Seal, label and freeze promptly.</p></div><div class="card stat"><div class="ico">④</div><div class="smallcap">Cook</div><p>Thaw in fridge; cook chicken to 74°C.</p></div></div>
${sectionhead('Six freezer-ready flavours','Each seasons about 450–500 g of chicken.')}
<div class="grid cols-2">${marinade.map(m=>{const d=detailedMarinades[m.name];return `<div class="card"><div class="smallcap">${esc(d?.serves||'One dinner pack')}</div><h3>${esc(m.name)}</h3><strong>Marinade ingredients</strong><ul>${(d?.i||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Prepare and cook</strong><ol>${(d?.s||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="muted" style="font-size:12px"><a href="${m.url}" target="_blank" rel="noopener noreferrer">Optional inspiration: ${esc(m.publisher)} ↗</a></p></div>`}).join('')}</div>
${sectionhead('Freezer inventory','Notes remain in your browser only and do not sync.')}
<textarea class="note-area" id="freezerNotes" placeholder="Example: ginger-soy chicken 500 g, frozen October 25...">${esc(state.notes.freezer||'')}</textarea>
<div class="callout gold" style="margin-top:17px"><strong>Safety:</strong> Keep raw meat cold. Never thaw on the counter, and never serve uncooked raw-contact marinade as sauce. For quality, use frozen packs within about two to three months.</div>`}
function recipeCard(r,expanded=false){const source=testedSources[r.id],d=detailedDinners[r.id],link=source?'<a href="'+source[1]+'" target="_blank" rel="noopener noreferrer">Original inspiration: '+esc(source[0])+' ↗</a>':'';return `<article class="recipe-card" id="recipe-${r.id}"><div class="recipe-top"><span class="recipe-emoji">${r.emoji}</span><span class="timetag">${esc(d?.time||r.time)}</span></div><div class="recipe-info"><h3>${esc(r.name)}</h3><p>${esc(d?.makes||r.servings)}</p><div class="recipe-detail ${expanded?'':'hide'}" id="detail-${r.id}"><strong>Ingredients</strong><ul class="ingredients-list">${(d?.ingredients||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Cook it</strong><ol>${(d?.steps||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>${d?.prep?`<p class="notice"><b>Prep ahead:</b> ${esc(d.prep)}</p>`:''}<p style="font-size:12px;color:var(--muted)">A practical home-kitchen adaptation with original, concise instructions. ${link} is optional for extra detail, technique photos or the publisher's own version.</p></div><button class="btn btn-outline" data-toggle-recipe="${r.id}" aria-expanded="${expanded}">${expanded?'Hide recipe ↑':'Ingredients & method →'}</button></div></article>`}
function recipesPage(){const types=['All','Chicken','Turkey','Fish','Tofu','Beef','Legumes'];const list=recipes.filter(r=>(state.recipeFilter==='All'||r.type===state.recipeFilter)&&`${r.name} ${r.ingredients} ${r.type}`.toLowerCase().includes(state.search.toLowerCase()));return `${heading('Recipe book','Every dinner includes the ingredients, quantities, steps and prep-ahead notes right here. These are practical home adaptations inspired by established recipes; links are optional for original techniques.')}
 <div class="flexrow no-print" style="align-items:start;flex-wrap:wrap;margin-bottom:18px"><div class="tabs-inline">${types.map(x=>`<button data-type="${x}" class="pill ${state.recipeFilter===x?'active':''}">${x}</button>`).join('')}</div><input id="recipeSearch" class="filter-input" aria-label="Search recipes" placeholder="Search recipes…" value="${esc(state.search)}"></div>
 <div class="grid cols-3" id="recipesGrid">${list.map(r=>recipeCard(r,r.id===state.notes.openRecipe)).join('')}</div>${list.length?'':'<div class="card" style="margin-top:16px">No recipes match that search.</div>'}
 ${sectionhead('Ninja frozen vegetable cheat sheet','Air fry frozen florets without thawing.')}
 <div class="grid cols-3"><div class="card"><div class="smallcap">Broccoli</div><h3>200°C · 12–16 min</h3><p>Start with 300–400 g. Shake midway; check tenderness.</p></div><div class="card"><div class="smallcap">Cauliflower</div><h3>200°C · 15–20 min</h3><p>Single layer for browning. Larger pieces may take longer.</p></div><div class="card"><div class="smallcap">Edamame</div><h3>Follow package</h3><p>Usually easiest to boil or steam; add to bowls after cooking.</p></div></div><p class="notice" style="margin-top:15px">Air-fryer timing is approximate and varies with Ninja model and basket size. Follow the package instructions for frozen products. A single basket used for both meat and vegetables in sequence will increase total dinner time.</p>`}
function breakfasts(){return `${heading('Breakfasts with exact fruit','Complete, no-guesswork breakfast recipes for two adults. Blueberries, strawberries, ripe bananas and Gala apples are specified, including quantities.')}
<div class="grid cols-2" style="margin-top:18px">${breakfastRecipes.map(b=>{const d=detailedBreakfasts[b.name];return `<div class="card"><div class="smallcap">${esc(d?.serves||'2 portions')}</div><h3>${esc(b.name)}</h3>${d?`<strong>Ingredients</strong><ul>${d.i.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Method</strong><ol>${d.s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:'<p class="notice">Recipe ingredients need an update. Choose another breakfast while this is corrected.</p>'}${b.url?`<p class="muted" style="font-size:12px"><a href="${b.url}" target="_blank" rel="noopener noreferrer">Optional original inspiration: ${esc(b.publisher)} ↗</a></p>`:''}</div>`}).join('')}</div>`}
function sides(){const ss=weeklySides[state.week];return `${heading('Sides & pickles','Everything you need to make six colourful sides, with ingredients and instructions on this page. Pick one or two favourites; these are optional enhancements.')}
${weekSelect()}${sectionhead('Ideas for this week','The recommended sides, not a mandatory checklist.')}
<div class="grid cols-2">${ss.map(n=>{const s=sideRecipes.find(x=>x.name===n);return `<div class="card"><h3>${esc(n)}</h3><p>Pairs with: ${esc(s?.pair||'Any meal')}</p></div>`}).join('')}</div>
${sectionhead('All six recipes','Detailed instructions, plus links only for optional reference.')}
<div class="grid cols-2">${sideRecipes.map(s=>{const d=detailedSides[s.name];return `<div class="card"><div class="smallcap">${esc(d?.serves||'Side dish')} · ${esc(s.time)}</div><h3>${esc(s.name)}</h3><strong>Ingredients</strong><ul>${(d?.i||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><strong>Method</strong><ol>${(d?.s||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ol><p class="muted" style="font-size:12px"><b>Storage:</b> ${esc(s.storage)}</p><p class="muted" style="font-size:12px"><a href="${s.url}" target="_blank" rel="noopener noreferrer">Optional reference: ${esc(s.publisher)} ↗</a></p></div>`}).join('')}</div>
<div class="callout gold" style="margin-top:18px"><strong>Food safety:</strong> Quick pickles must be refrigerated. These are not shelf-stable canning recipes. Keep chilled, use clean utensils and prepare small batches.</div>`}
function safety(){return `${heading('Food safety & storage','A practical reference for handling Sunday batches, rice, marinated meat and quick weekday cooking. Canadian guidance governs all temperature targets below.')}
 <div class="grid cols-4"><div class="card stat"><div class="ico">🌡️</div><div class="big">≤4°C</div><div class="meta">Refrigerator temperature</div></div><div class="card stat"><div class="ico">❄</div><div class="big">−18°C</div><div class="meta">Freezer temperature</div></div><div class="card stat"><div class="ico">🍗</div><div class="big">74°C</div><div class="meta">Chicken / ground poultry internal temperature</div></div><div class="card stat"><div class="ico">♨</div><div class="big">74°C</div><div class="meta">Reheated leftovers internal temperature</div></div></div>
 ${sectionhead('Essential handling rules','These take precedence over the suggested menu order and cooking times.')}
 <div class="safety-grid"><div class="safety-item"><div class="symbol">🍚</div><b>Rice and grain blend</b><p>With the larger 5-cup dry batch, spread into shallow containers and refrigerate or freeze promptly (within two hours). Refrigerate only the next 1–2 days' portions and freeze the rest immediately. Do not leave a large pot cooling on the counter. Reheat individual servings thoroughly to 74°C.</p></div><div class="safety-item"><div class="symbol">🧊</div><b>Later-week meals</b><p>Use refrigerated leftovers within 2–3 days, or freeze promptly for later use. Label with cooking date. Avoid repeated heating and cooling.</p></div><div class="safety-item"><div class="symbol">🍗</div><b>Raw marinated meat</b><p>Marinate in the refrigerator. Freeze promptly in sealed bags. Thaw on a tray on the bottom fridge shelf and separate raw from cooked food.</p></div><div class="safety-item"><div class="symbol">🥣</div><b>Raw-contact marinades</b><p>Never reuse as an uncooked sauce. Reserve a clean sauce before adding raw meat, or thoroughly boil marinade used during cooking.</p></div><div class="safety-item"><div class="symbol">🐟</div><b>Fish and other proteins</b><p>Fish: 70°C. Ground beef: 71°C. Chicken and ground poultry: 74°C. Check the thickest part with a digital thermometer.</p></div><div class="safety-item"><div class="symbol">🥗</div><b>Lunches and produce</b><p>Refrigerate cut vegetables, keep cold lunches chilled with ice packs, and wash produce. Store raw meat in leakproof containers below ready-to-eat foods.</p></div></div>
 <div class="callout gold" style="margin-top:19px"><strong>Special consideration for the Ninja:</strong> A browned exterior is not proof that chicken is safely cooked. Always verify 74°C internally. Use the manufacturer's manual for your exact model, and never overcrowd the basket if you want roasted rather than steamed frozen vegetables.</div>
 ${sectionhead('Health Canada sources','Open the original guidance for more detailed storage and cooking rules.')}
 <div class="card"><div class="grid cols-2">${safelinks.map(([name,url])=>`<a href="${url}" target="_blank" rel="noopener noreferrer">↗ ${name}</a>`).join('')}</div></div>`}
function footer(){return `<footer class="footer">THE SELIBIO TABLE · A personal home-kitchen planning tool · Prepared October 2026.<br>Recipes and quantities are flexible estimates; tailor for appetite, allergies and dietary requirements. Check original food-safety guidance when in doubt.<br><span class="no-print">This is a self-contained offline webpage. Your week selection, shopping checkboxes, prep checklist and notes are saved locally in this browser, not synced to other devices.</span></footer>`}
function render(){document.getElementById('nav').innerHTML=sections.map(([id,name,icon])=>`<button class="${state.page===id?'active':''}" data-go="${id}" aria-current="${state.page===id?'page':'false'}"><span class="ni">${icon}</span><span>${name}</span></button>`).join('');document.getElementById('topTitle').textContent=sections.find(x=>x[0]===state.page)?.[1]||'Meal Prep';document.getElementById('topWeek').textContent=`Week ${state.week+1} of 4`;
 const pages={home,menu,shopping,prep,marinades,recipes:recipesPage,breakfasts,sides,safety};document.getElementById('view').innerHTML=`<div class="print-header">THE SELIBIO TABLE · Week ${state.week+1}</div>`+(pages[state.page]||home)()+footer();}
function toast(msg){let box=document.getElementById('toast');if(!box){box=document.createElement('div');box.id='toast';box.style.cssText='position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#163d32;color:#fff;padding:11px 18px;border-radius:12px;font-size:12px;box-shadow:0 10px 25px #0003;z-index:50;';document.body.appendChild(box)}box.textContent=msg;box.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>box.style.display='none',2300)}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Copied to clipboard')).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('Copied to clipboard')}catch(e){toast('Copy unavailable in this browser')}t.remove()}
function shopText(){let out=`THE SELIBIO TABLE — WEEK ${state.week+1}: ${currentWeek().title}\n\n`;const gs={};allShopping().forEach(x=>(gs[x.cat]??=[]).push(x));for(const [cat,items] of Object.entries(gs)){out+=cat.toUpperCase()+'\n'+items.map(x=>`[ ] ${x.name} — ${x.qty}`).join('\n')+'\n\n'}return out}
function handleClick(e){const b=e.target.closest('[data-go],[data-week],[data-action],[data-recipe],[data-toggle-recipe],[data-type],[data-lunch]');if(!b)return;if(b.dataset.lunch){const p=document.getElementById('lunch-'+b.dataset.lunch);if(p){p.classList.toggle('hide');b.textContent=p.classList.contains('hide')?b.textContent.replace(' · hide ↑',' · recipe ↓'):b.textContent.replace(' · recipe ↓',' · hide ↑')}return}if(b.dataset.go){setPage(b.dataset.go);return}if(b.dataset.week!==undefined){setWeek(Number(b.dataset.week));return}if(b.dataset.type){state.recipeFilter=b.dataset.type;save();render();return}if(b.dataset.recipe){state.notes.openRecipe=b.dataset.recipe;state.recipeFilter='All';state.search='';setPage('recipes');setTimeout(()=>document.getElementById(`recipe-${b.dataset.recipe}`)?.scrollIntoView({behavior:'smooth',block:'center'}),30);return}if(b.dataset.toggleRecipe){const id=b.dataset.toggleRecipe;state.notes.openRecipe=state.notes.openRecipe===id?'':id;save();const box=document.getElementById(`detail-${id}`);box?.classList.toggle('hide');b.textContent=box?.classList.contains('hide')?'Ingredients & method →':'Hide recipe ↑';b.setAttribute('aria-expanded',box?.classList.contains('hide')?'false':'true');return}if(b.dataset.action){const a=b.dataset.action;if(a==='copy-shop')copyText(shopText());if(a==='print')window.print();if(a==='reset-shop'){Object.keys(state.checked).filter(k=>k.startsWith(`shop-${state.week}-`)).forEach(k=>delete state.checked[k]);save();render()}if(a==='reset-prep'){Object.keys(state.checked).filter(k=>k.startsWith(`prep-${state.week}-`)).forEach(k=>delete state.checked[k]);save();render()}return}}
function handleChange(e){const t=e.target;if(t.dataset.check){toggleCheck(t.dataset.check,Number(t.dataset.index))}}
document.getElementById('view').addEventListener('click',handleClick);document.getElementById('nav').addEventListener('click',handleClick);document.getElementById('view').addEventListener('change',handleChange);
document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='freezerNotes'){state.notes.freezer=e.target.value;save()}if(e.target.id==='recipeSearch'){const pos=e.target.selectionStart;state.search=e.target.value;save();const filtered=recipes.filter(r=>(state.recipeFilter==='All'||r.type===state.recipeFilter)&&`${r.name} ${r.ingredients} ${r.type}`.toLowerCase().includes(state.search.toLowerCase()));document.getElementById('recipesGrid').innerHTML=filtered.map(r=>recipeCard(r,r.id===state.notes.openRecipe)).join('');e.target.setSelectionRange(pos,pos)}});
document.getElementById('mobileMenu').addEventListener('click',()=>{const x=document.getElementById('navwrap');x.classList.toggle('open');document.getElementById('mobileMenu').setAttribute('aria-expanded',String(x.classList.contains('open')))});
document.getElementById('backtop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));document.getElementById('printBtn').addEventListener('click',()=>window.print());
render();
</script>
