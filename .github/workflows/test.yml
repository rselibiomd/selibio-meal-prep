name: Planner tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check recipe-data.js
      - run: node --check planner.js
      - run: node --test tests/planner.test.cjs
